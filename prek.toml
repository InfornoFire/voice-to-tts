[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "bash -c 'cd src-tauri && cargo fmt --check'"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "bash -c 'cd src-tauri && cargo clippy --all-targets -- -D warnings'"
language = "system"
types = ["rust"]
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "pnpm-lint"
name = "pnpm lint"
entry = "pnpm run lint"
language = "system"
types_or = ["ts", "tsx", "javascript", "jsx"]
pass_filenames = false
