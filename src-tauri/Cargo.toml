[package]
name = "voice-to-tts"
version = "0.1.0"
description = "A speech-to-text and text-to-speech app."
authors = ["Inforno"]
edition = "2024"
rust-version = "1.99.1"

[lib]
name = "voice_to_tts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
mock-engine = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18"
log = "0.4"
ringbuf = "0.6"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sherpa-onnx = "2"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
windows = { version = "0.62", features = ["Win32_System_ProcessStatus"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
